name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Selbsttest
        run: |
          pip install -r scripts/requirements.txt reportlab
          python scripts/selbsttest.py
      - name: ZIP für claude.ai / ChatGPT bauen
        run: |
          mkdir -p dist/pdf-seitenweise-sichten
          cp -r SKILL.md LICENSE scripts references dist/pdf-seitenweise-sichten/
          cd dist && zip -r "pdf-seitenweise-sichten-${GITHUB_REF_NAME}.zip" pdf-seitenweise-sichten
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes "Siehe CHANGELOG.md. ZIP direkt in claude.ai oder ChatGPT hochladen."
